[package]
name = "motion-gimbal"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
resolver = "3"
description = "Real-time motion-saliency gimbal tracking: Rust host + Python vision"

[lib]
name = "motion_gimbal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
base64 = "0.22"
jpeg-encoder = "0.6"
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_Security"] }

[target."cfg(unix)".dependencies]
memmap2 = "0.9.12"
